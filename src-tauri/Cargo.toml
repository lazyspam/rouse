[package]
name = "rouse"
version = "0.1.0"
description = "Remember every dev command you run, then start whole projects from one window"
authors = ["iput-object"]
license = "GPL-3.0-only"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin (cargo issue 8519).
name = "rouse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "~2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
portable-pty = "0.9"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["tray-icon", "test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
